name: Clean downloads folder

on:
  workflow_dispatch:

jobs:
  delete:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Delete downloads folder via API
        run: |
          # حذف فولدر با استفاده از GitHub API
          curl -X DELETE \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/contents/downloads \
            -d '{"message":"Clean downloads folder","branch":"main"}' \
            || echo "Folder may not exist"
          
          # ایجاد دوباره فولدر با README
          echo "README" | base64 > readme.txt
          curl -X PUT \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/contents/downloads/README.md \
            -d "{\"message\":\"Create README\",\"branch\":\"main\",\"content\":\"$(echo -n '# Empty Folder' | base64 -w 0)\"}"
